; Radiance - Player Light Source 1.1.0: your character gives off light.
; Client side: it needs nothing in your backpack or hands, and nothing on the server.
; Other players see your light only if they have Radiance too.
; F8 turns the light on or off, Shift+F8 opens the Radiance menu in game (the keys can be changed below).
; The menu writes what you change into this file. Saving this file while the game runs also
; changes the light within a second.
[Light]
; true = light on, false = off.
Enabled=true
; The light's color: red, green, blue from 0 to 255, or a web color such as #FF8958.
; The menu offers nine colors; any other color can be set here.
; The default is the warm orange of a Wax Torch. White: 255, 255, 255. Moonlight: 150, 190, 255.
Color=255, 137, 88
; How bright. 1 = a Wax Torch, 0.5 = half, 2 = double. 0 turns the light off.
Intensity=1.0
; How far the light reaches, in metres (0.5 to 300). 45 is a Wax Torch.
Radius=45
; How fast the light flickers. 1 = like a flame, 0 = steady.
Flicker=1.0
; Where the light sits: metres above your feet. 1.3 is chest height.
Height=1.3
; true = the light casts shadows (your own body's too). Costs some frame rate.
Shadows=false

[Multiplayer]
; Players who both have Radiance see each other's light, on any server (the server needs nothing).
; true = the other players' Radiance is told what your light is.
ShareMyLight=true
; true = you see the lights of other players who share theirs.
ShowOtherLights=true

[Keys]
; Changes here apply within a second; no restart needed.
; Keys: a letter, digit, F1-F24, Enter, Tab, Space, Backspace, Up, Down, Left, Right and so on,
; with Shift+, Ctrl+, Alt+ in front. Controller: after a comma, Pad: and any of
; A B X Y LB RB LT RT LS RS View Menu Up Down Left Right, joined with +.
; NoPad or NoKeys turns one side off, None both.
; Turns the light on or off.
ToggleLight=F8, NoPad
; Opens and closes the menu. The menu is used with the mouse; Esc closes it too.
OpenMenu=Shift+F8, Pad:LB+Left
; In the menu, for a controller: move between the rows, change the marked row, close.
MenuUp=NoKeys, Pad:Up
MenuDown=NoKeys, Pad:Down
MenuLeft=NoKeys, Pad:Left
MenuRight=NoKeys, Pad:Right
MenuClose=NoKeys, Pad:B

[Menu]
; Language of the menu. auto = the game's own language.
; Or one of: en fr it de es ja ko pl pt ru zh-hans zh-hant tr uk th
; Read when the game starts.
Language=auto
